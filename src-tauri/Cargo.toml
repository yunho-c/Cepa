[package]
name = "cepa"
version = "0.1.0"
description = "A fast, cross-platform disk space analyzer"
authors = ["Cepa contributors"]
license = "MIT"
homepage = "https://github.com/yunho-c/Cepa"
repository = "https://github.com/yunho-c/Cepa"
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cepa_lib"
# Cepa is desktop-only. Mobile-facing static and dynamic library artifacts add
# no usable target and can overflow MinGW's DLL export table in debug tests.
crate-type = ["rlib"]

[[bin]]
name = "cepa"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "window_state_smoke"
path = "examples/window_state_smoke.rs"
required-features = ["desktop"]

[[example]]
name = "native_scan_smoke"
path = "examples/native_scan_smoke.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-window-state",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.5"
jwalk = "0.8.1"
regex = "1"
sysinfo = { version = "0.38.4", default-features = false, features = ["disk"] }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
tauri-plugin-opener = { version = "2.5.4", optional = true }
tauri-plugin-window-state = { version = "2.4.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
crossbeam-channel = "0.5"
miniz_oxide = "0.8.9"
rayon = "1.11"

[target.'cfg(target_os = "linux")'.dependencies]
crossbeam-channel = "0.5"
rustix = { version = "1.1.4", features = ["fs"] }
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(windows)'.dependencies]
lznt1 = "0.1.3"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3.27.0"
