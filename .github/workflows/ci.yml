name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04
            artifact: cepa-linux
            archive: cepa-linux-bundles.tar.gz
          - name: macOS
            runner: macos-latest
            artifact: cepa-macos
            archive: cepa-macos-bundles.tar.gz
          - name: Windows
            runner: windows-latest
            artifact: cepa-windows
            archive: cepa-windows-bundles.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-daemon \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            rpm \
            xvfb \
            xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0
          fallback: none

      - name: Install frontend dependencies
        run: just install

      - name: Validate dependency-light native core
        run: just native-check

      - name: Run checks and tests
        run: just check

      - name: Validate Linux statx accounting and cancellation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/cepa-statx-fixture"
          just benchmark-fixture "$fixture" 32 128 4096
          printf 'hard-link fixture\n' > "$fixture/hard-link-source.bin"
          ln "$fixture/hard-link-source.bin" "$fixture/group-0000/hard-link-copy.bin"
          ln -s /etc "$fixture/external-directory-link"
          just validate-scan "$fixture" jwalk statx
          just benchmark-cancellation "$fixture" statx 3 1024

      - name: Build native application
        run: just build

      - name: Validate production WebView scan flow
        if: runner.os != 'Windows'
        run: |
          fixture="$RUNNER_TEMP/cepa-native-scan-fixture"
          just benchmark-fixture "$fixture" 32 32 4096
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            just native-scan-smoke-linux "$fixture"
          else
            just native-scan-smoke "$fixture"
          fi

      - name: Smoke Linux desktop startup
        if: runner.os == 'Linux'
        run: just smoke-linux-desktop

      - name: Build distribution bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: just bundle

      - name: Validate, smoke, and archive Linux distribution bundles
        if: runner.os == 'Linux'
        run: |
          just validate-linux-bundles
          appimage=$(find src-tauri/target/release/bundle/appimage \
            -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          APPIMAGE_EXTRACT_AND_RUN=1 just smoke-linux-desktop "$appimage"
          (
            cd src-tauri/target/release/bundle
            tar -czf "$RUNNER_TEMP/cepa-linux-bundles.tar.gz" \
              deb/*.deb rpm/*.rpm appimage/*.AppImage
          )

      - name: Validate and archive macOS distribution bundles
        if: runner.os == 'macOS'
        run: |
          just validate-macos-bundles
          (
            cd src-tauri/target/release/bundle
            tar -czf "$RUNNER_TEMP/cepa-macos-bundles.tar.gz" \
              macos/*.app dmg/*.dmg
          )

      - name: Validate and archive Windows distribution bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          just validate-windows-bundles
          $bundleRoot = "src-tauri/target/release/bundle"
          $packages = @(
            Get-ChildItem "$bundleRoot/msi/*.msi"
            Get-ChildItem "$bundleRoot/nsis/*.exe"
          )
          Compress-Archive -LiteralPath $packages.FullName -DestinationPath "$env:RUNNER_TEMP/cepa-windows-bundles.zip"

      - name: Retain distribution bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14
